name: 发布项目进度

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 使用 UTC；每 6 小时执行一次。
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: project-progress-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 生成静态进度页面
        shell: pwsh
        run: .\tools\ProjectProgress.ps1 -GenerateOnly

      - name: 上传静态站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/project-progress

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
