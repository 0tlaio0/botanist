<div id="botanist-card-ui-review">
  <style>
    #botanist-card-ui-review {
      --botanist-cyan: #2fd0ea;
      --botanist-ink: #101114;
      --botanist-paper: #d0d0d2;
      --botanist-text: #f2e7c8;
      --botanist-gold: #e6c15a;
      --botanist-up: #7dff7a;
      --botanist-fire: #3a1408;
      --botanist-fire-ink: #ffb070;
      --botanist-earth: #2a1c0c;
      --botanist-earth-ink: #e2c48a;
      --botanist-sprout: #16351c;
      --botanist-sprout-ink: #9be56f;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      color: light-dark(#16303a, #e8eef2);
      background: transparent;
    }
    #botanist-card-ui-review .botanist-stage {
      display: flex;
      flex-wrap: wrap;
      gap: 28px 36px;
      align-items: flex-end;
      justify-content: center;
    }
    #botanist-card-ui-review .botanist-wrap {
      width: 250px;
      position: relative;
      padding-top: 46px;
    }
    #botanist-card-ui-review .botanist-card {
      position: relative;
      width: 250px;
      height: 352px;
      border-radius: 18px;
      background: var(--botanist-cyan);
      box-sizing: border-box;
      padding: 7px;
    }
    #botanist-card-ui-review .botanist-inner {
      height: 100%;
      border-radius: 12px;
      background: var(--botanist-ink);
      overflow: hidden;
      position: relative;
    }
    #botanist-card-ui-review .botanist-portrait {
      position: absolute;
      left: 50%;
      top: 86px;
      width: 148px;
      height: 148px;
      margin-left: -74px;
      border-radius: 50%;
      background: #1b2a58;
      outline: 8px solid #1ad0ea;
      outline-offset: -8px;
    }
    #botanist-card-ui-review .botanist-star {
      position: absolute;
      inset: 28px;
      background: #2a3f78;
      clip-path: polygon(50% 6%, 61% 38%, 96% 38%, 67% 58%, 78% 92%, 50% 72%, 22% 92%, 33% 58%, 4% 38%, 39% 38%);
    }
    #botanist-card-ui-review .botanist-star-core {
      position: absolute;
      left: 50%;
      top: 48%;
      width: 18px;
      height: 18px;
      margin: -9px 0 0 -9px;
      border-radius: 50%;
      background: #d7e7ff;
    }
    #botanist-card-ui-review .botanist-banner {
      position: absolute;
      top: 46px;
      left: -6px;
      right: -6px;
      height: 32px;
      background: var(--botanist-paper);
      clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0 50%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2b2b2b;
      font-weight: 500;
    }
    #botanist-card-ui-review .botanist-type {
      position: absolute;
      left: 50%;
      top: 228px;
      transform: translateX(-50%);
      min-width: 58px;
      height: 22px;
      padding: 0 10px;
      border-radius: 3px;
      background: #c8c8c8;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #botanist-card-ui-review .botanist-desc {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      height: 84px;
      border-radius: 4px;
      background: #1b1713;
      color: var(--botanist-text);
      line-height: 1.45;
      text-align: center;
      padding: 10px 8px;
      box-sizing: border-box;
    }
    #botanist-card-ui-review .botanist-gold { color: var(--botanist-gold); }
    #botanist-card-ui-review .botanist-up { color: var(--botanist-up); }
    #botanist-card-ui-review .botanist-energy {
      position: absolute;
      left: -8px;
      top: -8px;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #2f8dff;
      color: #f7fbff;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }
    #botanist-card-ui-review .botanist-play-el {
      position: absolute;
      left: 8px;
      top: 42px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 6;
      border: 2px solid #f3ead2;
    }
    #botanist-card-ui-review .el-fire { background: var(--botanist-fire); color: var(--botanist-fire-ink); }
    #botanist-card-ui-review .el-earth { background: var(--botanist-earth); color: var(--botanist-earth-ink); }
    #botanist-card-ui-review .botanist-sprout-stack {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translate(-50%, 0);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 8;
      pointer-events: none;
    }
    #botanist-card-ui-review .botanist-sprout {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--botanist-sprout);
      color: var(--botanist-sprout-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #b6f08a;
    }
    #botanist-card-ui-review .botanist-req {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    #botanist-card-ui-review .botanist-req-el {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #f3ead2;
      position: relative;
    }
    #botanist-card-ui-review .botanist-count {
      position: absolute;
      right: -6px;
      bottom: -5px;
      min-width: 14px;
      height: 14px;
      border-radius: 8px;
      background: #111;
      color: #fff;
      text-align: center;
      padding: 0 2px;
    }
    #botanist-card-ui-review .botanist-caption {
      text-align: center;
      margin-top: 8px;
      opacity: 0.8;
    }
  </style>

  <div class="botanist-stage">
    <div class="botanist-wrap" id="botanist-defend">
      <article class="botanist-card" aria-label="Defend card">
        <div class="botanist-inner">
          <div class="botanist-portrait"><div class="botanist-star"></div><div class="botanist-star-core"></div></div>
          <div class="botanist-banner">防御</div>
          <div class="botanist-type">技能</div>
          <div class="botanist-desc">获得5点格挡。</div>
        </div>
        <div class="botanist-energy">1</div>
        <div class="botanist-play-el el-earth" aria-label="earth">
          <i data-lucide="mountain" aria-hidden="true"></i>
        </div>
      </article>
      <div class="botanist-caption">元素在费用右下、标题横幅左端</div>
    </div>

    <div class="botanist-wrap" id="botanist-sunflower">
      <div class="botanist-sprout-stack" id="botanist-sprout-stack">
        <div class="botanist-sprout" aria-label="seedling">
          <i data-lucide="sprout" aria-hidden="true"></i>
        </div>
        <div class="botanist-req" id="botanist-req-row" aria-label="growth elements"></div>
      </div>
      <article class="botanist-card" aria-label="Sunflower card">
        <div class="botanist-inner">
          <div class="botanist-portrait"><div class="botanist-star"></div><div class="botanist-star-core"></div></div>
          <div class="botanist-banner">向日葵</div>
          <div class="botanist-type">种子</div>
          <div class="botanist-desc" id="botanist-sun-desc"></div>
        </div>
        <div class="botanist-energy">1</div>
        <div class="botanist-play-el el-fire" aria-label="fire">
          <i data-lucide="flame" aria-hidden="true"></i>
        </div>
      </article>
      <div class="botanist-caption">幼苗在正上方，成长元素在幼苗下方</div>
    </div>
  </div>

  <script>
    (function () {
      const sunflower = document.getElementById("botanist-sunflower");
      const reqRow = document.getElementById("botanist-req-row");
      const desc = document.getElementById("botanist-sun-desc");
      const stack = document.getElementById("botanist-sprout-stack");
      const state = {
        upgraded: false,
        reqStyle: "repeat",
        seedlingOnCard: false
      };

      function el(kind) {
        const node = document.createElement("div");
        node.className = "botanist-req-el " + (kind === "fire" ? "el-fire" : "el-earth");
        node.innerHTML = kind === "fire"
          ? '<i data-lucide="flame" aria-hidden="true"></i>'
          : '<i data-lucide="mountain" aria-hidden="true"></i>';
        return node;
      }

      function render() {
        reqRow.innerHTML = "";
        if (state.reqStyle === "repeat") {
          reqRow.appendChild(el("fire"));
          reqRow.appendChild(el("fire"));
          reqRow.appendChild(el("earth"));
        } else {
          const fire = el("fire");
          const earth = el("earth");
          const c1 = document.createElement("span");
          c1.className = "botanist-count";
          c1.textContent = "2";
          fire.appendChild(c1);
          const c2 = document.createElement("span");
          c2.className = "botanist-count";
          c2.textContent = "1";
          earth.appendChild(c2);
          reqRow.appendChild(fire);
          reqRow.appendChild(earth);
        }

        const block = state.upgraded ? '<span class="botanist-up">5</span>' : "3";
        desc.innerHTML = "获得" + block + "点格挡。<br>成长：获得一层<span class='botanist-gold'>向阳</span>。";
        stack.style.top = state.seedlingOnCard ? "8px" : "0px";
        sunflower.style.paddingTop = state.seedlingOnCard ? "18px" : "46px";
        if (window.lucide && typeof window.lucide.createIcons === "function") {
          window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
        }
      }

      render();

      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: sunflower, onChange: render });
        tweak.addToggle(state, "upgraded", { label: "Upgrade preview 3 to 5" });
        tweak.addSelect(state, "reqStyle", {
          label: "Growth icons",
          options: [
            { label: "Fire Fire Earth", value: "repeat" },
            { label: "Fire 2 Earth 1", value: "count" }
          ]
        });
        tweak.addToggle(state, "seedlingOnCard", { label: "Seedling on card top" });
      }
    })();
  </script>
</div>
